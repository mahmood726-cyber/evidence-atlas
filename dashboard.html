<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EvidenceAtlas — Cochrane Evidence Network</title>
<script src="https://d3js.org/d3.v7.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js" integrity="sha384-Hl48Kq2HifOWdXEjMsKo6qxqvRLTYqIGbvlENBmkHAxZKIGCXv43H6W1jA671RzC" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #0a0a1a;
  --bg2: #12122a;
  --bg3: #1a1a3a;
  --accent: #6366f1;
  --accent2: #818cf8;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --border: #2d2d5e;
  --green: #22c55e;
  --blue: #3b82f6;
  --amber: #f59e0b;
  --red: #ef4444;
  --teal: #14b8a6;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 20px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  height: 52px;
  flex-shrink: 0;
}
.header h1 {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--accent2);
  letter-spacing: 0.5px;
}
.header .stats-bar {
  display: flex;
  gap: 24px;
  font-size: 0.82rem;
  color: var(--text-dim);
}
.header .stats-bar span { color: var(--accent2); font-weight: 600; }

/* Tabs */
.tabs {
  display: flex;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab-btn {
  padding: 10px 24px;
  background: transparent;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 0.88rem;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.tab-btn:hover { color: var(--text); background: var(--bg3); }
.tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tab-btn.active { color: var(--accent2); border-bottom-color: var(--accent); }

/* Main layout */
.main { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 52px - 42px); }
.tab-content { display: none; width: 100%; height: 100%; overflow: auto; }
.tab-content.active { display: flex; flex-direction: column; }

/* Tab 1: Network */
#tab-network { flex-direction: row; overflow: hidden; }
.network-canvas { flex: 1; position: relative; }
.network-canvas svg { width: 100%; height: 100%; }
.network-controls {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.ctrl-group {
  background: rgba(10,10,26,0.92);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
}
.ctrl-group label {
  display: block;
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.ctrl-group select, .ctrl-group input[type="text"] {
  width: 200px;
  padding: 5px 8px;
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 0.85rem;
}
.ctrl-group input[type="text"]::placeholder { color: var(--text-dim); }
.ctrl-group .checkbox-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.82rem;
  color: var(--text-dim);
  margin-top: 4px;
}
.ctrl-group .checkbox-row input { accent-color: var(--accent); }

/* Detail panel */
.detail-panel {
  width: 340px;
  background: var(--bg2);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
  flex-shrink: 0;
}
.detail-panel h2 {
  font-size: 1.1rem;
  color: var(--accent2);
  margin-bottom: 12px;
}
.detail-panel .empty-state {
  color: var(--text-dim);
  font-size: 0.88rem;
  text-align: center;
  padding-top: 40px;
}
.detail-section {
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.detail-section:last-child { border-bottom: none; }
.detail-section h3 {
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.detail-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 0.85rem;
}
.detail-row .label { color: var(--text-dim); }
.detail-row .value { font-weight: 600; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-A { background: rgba(34,197,94,0.2); color: var(--green); }
.badge-B { background: rgba(59,130,246,0.2); color: var(--blue); }
.badge-C { background: rgba(245,158,11,0.2); color: var(--amber); }
.badge-D { background: rgba(239,68,68,0.2); color: var(--red); }
.badge-Robust { background: rgba(34,197,94,0.2); color: var(--green); }
.badge-Moderate { background: rgba(59,130,246,0.2); color: var(--blue); }
.badge-Fragile { background: rgba(245,158,11,0.2); color: var(--amber); }
.badge-Unstable { background: rgba(239,68,68,0.2); color: var(--red); }
.connected-list {
  max-height: 200px;
  overflow-y: auto;
  margin-top: 4px;
}
.connected-item {
  display: flex;
  justify-content: space-between;
  padding: 4px 6px;
  font-size: 0.82rem;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.15s;
}
.connected-item:hover { background: var(--bg3); }
.connected-item .weight { color: var(--accent2); font-weight: 600; }

/* Tab 2: Clusters */
#tab-clusters { padding: 20px; overflow: auto; }
.cluster-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 16px;
}
.cluster-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
}
.cluster-card h3 {
  font-size: 0.95rem;
  color: var(--accent2);
  margin-bottom: 8px;
}
.cluster-members {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 8px;
}
.cluster-tag {
  padding: 2px 8px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 0.75rem;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.15s;
}
.cluster-tag:hover { border-color: var(--accent); color: var(--accent2); }
.cluster-chart { margin-top: 20px; }

/* Tab 3: Review detail */
#tab-review { padding: 20px; overflow: auto; }
.review-hero {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.metric-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
}
.metric-card .value {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--accent2);
}
.metric-card .label {
  font-size: 0.78rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: 4px;
}
.review-tables {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.review-table-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
}
.review-table-card h3 {
  font-size: 0.95rem;
  color: var(--accent2);
  margin-bottom: 12px;
}
table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.83rem;
}
table.data-table th, table.data-table td {
  padding: 6px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
table.data-table th {
  color: var(--text-dim);
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.72rem;
  letter-spacing: 0.5px;
}
table.data-table tr:hover { background: var(--bg3); }

/* Tab 4: Statistics */
#tab-stats { padding: 20px; overflow: auto; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.chart-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
}
.chart-card h3 {
  font-size: 0.95rem;
  color: var(--accent2);
  margin-bottom: 12px;
}

/* Tooltip */
.tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(10,10,26,0.95);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 0.82rem;
  line-height: 1.5;
  z-index: 100;
  max-width: 280px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.tooltip .tt-id { color: var(--accent2); font-weight: 700; font-size: 0.92rem; }
.tooltip .tt-row { color: var(--text-dim); }
.tooltip .tt-row span { color: var(--text); font-weight: 500; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

/* Legend */
.legend {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: rgba(10,10,26,0.92);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  z-index: 10;
}
.legend-title {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.legend-items { display: flex; gap: 12px; }
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.78rem;
  color: var(--text-dim);
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
</style>
</head>
<body>

<div class="header">
  <h1>EvidenceAtlas</h1>
  <div class="stats-bar" id="header-stats"></div>
</div>

<div class="tabs" role="tablist">
  <button class="tab-btn active" role="tab" aria-selected="true" data-tab="tab-network" tabindex="0">Network Map</button>
  <button class="tab-btn" role="tab" aria-selected="false" data-tab="tab-clusters" tabindex="-1">Cluster Analysis</button>
  <button class="tab-btn" role="tab" aria-selected="false" data-tab="tab-review" tabindex="-1">Review Detail</button>
  <button class="tab-btn" role="tab" aria-selected="false" data-tab="tab-stats" tabindex="-1">Statistics</button>
</div>

<div class="main">
  <!-- Tab 1: Network Map -->
  <div class="tab-content active" id="tab-network" role="tabpanel">
    <div class="network-canvas" id="network-canvas">
      <div class="network-controls">
        <div class="ctrl-group">
          <label for="search-input">Search Review</label>
          <input type="text" id="search-input" placeholder="Type CD number..." autocomplete="off">
        </div>
        <div class="ctrl-group">
          <label for="color-mode">Color By</label>
          <select id="color-mode">
            <option value="quality">Quality Grade</option>
            <option value="robustness">Robustness</option>
            <option value="oracle">Oracle Risk</option>
            <option value="audit">Audit Severity</option>
          </select>
        </div>
        <div class="ctrl-group">
          <label for="size-mode">Size By</label>
          <select id="size-mode">
            <option value="n_mas">Number of MAs</option>
            <option value="k">Number of Studies</option>
            <option value="audit_fails">Audit Fails</option>
          </select>
        </div>
        <div class="ctrl-group">
          <div class="checkbox-row">
            <input type="checkbox" id="show-isolated" checked>
            <label for="show-isolated">Show isolated nodes</label>
          </div>
          <div class="checkbox-row">
            <input type="checkbox" id="show-labels">
            <label for="show-labels">Show labels</label>
          </div>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <svg id="network-svg"></svg>
      <div class="tooltip" id="tooltip" style="display:none;"></div>
    </div>
    <div class="detail-panel" id="detail-panel">
      <h2>Review Details</h2>
      <div class="empty-state" id="detail-empty">Click a node to inspect</div>
      <div id="detail-content" style="display:none;"></div>
    </div>
  </div>

  <!-- Tab 2: Clusters -->
  <div class="tab-content" id="tab-clusters" role="tabpanel">
    <h2 style="margin-bottom:4px;">Connected Components</h2>
    <p style="color:var(--text-dim);font-size:0.88rem;margin-bottom:16px;" id="cluster-summary"></p>
    <div id="cluster-chart-container" class="cluster-chart"></div>
    <div class="cluster-grid" id="cluster-grid"></div>
  </div>

  <!-- Tab 3: Review Detail -->
  <div class="tab-content" id="tab-review" role="tabpanel">
    <h2 style="margin-bottom:16px;" id="review-title">Select a review from the network</h2>
    <div class="review-hero" id="review-hero"></div>
    <div class="review-tables" id="review-tables"></div>
  </div>

  <!-- Tab 4: Statistics -->
  <div class="tab-content" id="tab-stats" role="tabpanel">
    <h2 style="margin-bottom:16px;">Network Statistics</h2>
    <div class="stats-grid" id="stats-cards"></div>
    <div class="charts-grid" id="stats-charts"></div>
  </div>
</div>

<script>
// ============================================================
// DATA LOADING
// ============================================================
let NETWORK_DATA = null;
let nodeMap = {};
let adjacency = {};
let simulation = null;
let selectedNode = null;
let components = [];

function loadData() {
  const script = document.getElementById('network-data-script');
  if (script) {
    NETWORK_DATA = JSON.parse(script.textContent);
  }
  if (!NETWORK_DATA) return;

  // Build lookup maps
  NETWORK_DATA.nodes.forEach(n => { nodeMap[n.id] = n; });

  // Build adjacency list
  NETWORK_DATA.nodes.forEach(n => { adjacency[n.id] = []; });
  NETWORK_DATA.edges.forEach(e => {
    if (adjacency[e.source] || adjacency[e.source] === undefined) {
      const src = typeof e.source === 'object' ? e.source.id : e.source;
      const tgt = typeof e.target === 'object' ? e.target.id : e.target;
      if (!adjacency[src]) adjacency[src] = [];
      if (!adjacency[tgt]) adjacency[tgt] = [];
      adjacency[src].push({ target: tgt, weight: e.weight });
      adjacency[tgt].push({ target: src, weight: e.weight });
    }
  });

  // Compute connected components
  computeComponents();
}

function computeComponents() {
  const visited = new Set();
  components = [];

  NETWORK_DATA.nodes.forEach(n => {
    if (visited.has(n.id)) return;
    const comp = [];
    const stack = [n.id];
    while (stack.length > 0) {
      const cur = stack.pop();
      if (visited.has(cur)) continue;
      visited.add(cur);
      comp.push(cur);
      (adjacency[cur] || []).forEach(nb => {
        if (!visited.has(nb.target)) stack.push(nb.target);
      });
    }
    components.push(comp);
  });

  components.sort((a, b) => b.length - a.length);
}

// ============================================================
// TABS
// ============================================================
function initTabs() {
  const btns = document.querySelectorAll('.tab-btn');
  const panels = document.querySelectorAll('.tab-content');

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      btns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); b.tabIndex = -1; });
      panels.forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      btn.tabIndex = 0;
      document.getElementById(btn.dataset.tab).classList.add('active');

      // Lazy-init tabs
      if (btn.dataset.tab === 'tab-clusters' && !clustersBuilt) buildClusters();
      if (btn.dataset.tab === 'tab-stats' && !statsBuilt) buildStats();
      if (btn.dataset.tab === 'tab-network') {
        // Resize SVG
        const canvas = document.getElementById('network-canvas');
        if (canvas && simulation) {
          const svg = d3.select('#network-svg');
          svg.attr('width', canvas.clientWidth).attr('height', canvas.clientHeight);
        }
      }
    });

    // Keyboard navigation
    btn.addEventListener('keydown', (e) => {
      const allBtns = Array.from(btns);
      const idx = allBtns.indexOf(btn);
      let next = -1;
      if (e.key === 'ArrowRight') next = (idx + 1) % allBtns.length;
      else if (e.key === 'ArrowLeft') next = (idx - 1 + allBtns.length) % allBtns.length;
      if (next >= 0) {
        e.preventDefault();
        allBtns[next].click();
        allBtns[next].focus();
      }
    });
  });
}

// ============================================================
// COLOR SCALES
// ============================================================
const gradeColors = { A: '#22c55e', B: '#3b82f6', C: '#f59e0b', D: '#ef4444' };
const robustnessColors = { Robust: '#22c55e', Moderate: '#3b82f6', Fragile: '#f59e0b', Unstable: '#ef4444' };
const oracleScale = d3.scaleSequential(d3.interpolateRdYlGn).domain([1, 0]);
const auditScale = d3.scaleSequential(d3.interpolateRdYlGn).domain([30, 0]);

function getNodeColor(node, mode) {
  if (mode === 'quality') {
    return gradeColors[node.quality_grade] || '#444';
  } else if (mode === 'robustness') {
    return robustnessColors[node.classification] || '#444';
  } else if (mode === 'oracle') {
    return node.oracle_risk != null ? oracleScale(node.oracle_risk) : '#444';
  } else if (mode === 'audit') {
    return auditScale(node.audit_severity || 0);
  }
  return '#6366f1';
}

function updateLegend(mode) {
  const legend = document.getElementById('legend');
  let title = '';
  let items = '';

  if (mode === 'quality') {
    title = 'Quality Grade';
    items = Object.entries(gradeColors).map(([k, c]) =>
      '<div class="legend-item"><div class="legend-dot" style="background:' + c + '"></div>' + k + '</div>'
    ).join('');
  } else if (mode === 'robustness') {
    title = 'Robustness';
    items = Object.entries(robustnessColors).map(([k, c]) =>
      '<div class="legend-item"><div class="legend-dot" style="background:' + c + '"></div>' + k + '</div>'
    ).join('');
  } else if (mode === 'oracle') {
    title = 'Oracle Risk';
    items = '<div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>Low</div>' +
            '<div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Medium</div>' +
            '<div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>High</div>';
  } else if (mode === 'audit') {
    title = 'Audit Severity';
    items = '<div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>Low</div>' +
            '<div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Medium</div>' +
            '<div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>High</div>';
  }

  legend.innerHTML = '<div class="legend-title">' + title + '</div><div class="legend-items">' + items + '</div>';
}

// ============================================================
// NETWORK VISUALIZATION
// ============================================================
function getNodeRadius(node, mode) {
  let val = 0;
  if (mode === 'n_mas') val = node.n_mas || 1;
  else if (mode === 'k') val = node.k || 1;
  else if (mode === 'audit_fails') val = (node.audit_fails || 0) + 1;
  return Math.max(3, Math.sqrt(val) * 2.5);
}

function buildNetwork() {
  const canvas = document.getElementById('network-canvas');
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;

  const svg = d3.select('#network-svg')
    .attr('width', width)
    .attr('height', height);

  // Clear
  svg.selectAll('*').remove();

  const g = svg.append('g').attr('class', 'network-g');

  // Zoom
  const zoom = d3.zoom()
    .scaleExtent([0.1, 8])
    .on('zoom', (event) => {
      g.attr('transform', event.transform);
    });
  svg.call(zoom);

  const colorMode = document.getElementById('color-mode').value;
  const sizeMode = document.getElementById('size-mode').value;
  const showIsolated = document.getElementById('show-isolated').checked;
  const showLabels = document.getElementById('show-labels').checked;

  // Filter nodes
  const connectedIds = new Set();
  NETWORK_DATA.edges.forEach(e => {
    const src = typeof e.source === 'object' ? e.source.id : e.source;
    const tgt = typeof e.target === 'object' ? e.target.id : e.target;
    connectedIds.add(src);
    connectedIds.add(tgt);
  });

  let visibleNodes = showIsolated
    ? NETWORK_DATA.nodes
    : NETWORK_DATA.nodes.filter(n => connectedIds.has(n.id));

  let visibleEdges = NETWORK_DATA.edges;

  // Build simulation nodes/links copies
  const simNodes = visibleNodes.map(n => ({ ...n }));
  const nodeIdToSim = {};
  simNodes.forEach(n => { nodeIdToSim[n.id] = n; });

  const simLinks = visibleEdges
    .filter(e => {
      const src = typeof e.source === 'object' ? e.source.id : e.source;
      const tgt = typeof e.target === 'object' ? e.target.id : e.target;
      return nodeIdToSim[src] && nodeIdToSim[tgt];
    })
    .map(e => ({
      source: typeof e.source === 'object' ? e.source.id : e.source,
      target: typeof e.target === 'object' ? e.target.id : e.target,
      weight: e.weight
    }));

  // D3 force simulation
  simulation = d3.forceSimulation(simNodes)
    .force('link', d3.forceLink(simLinks).id(d => d.id).distance(d => 80 / Math.sqrt(d.weight || 1)))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide(d => getNodeRadius(d, sizeMode) + 2))
    .force('x', d3.forceX(width / 2).strength(0.03))
    .force('y', d3.forceY(height / 2).strength(0.03));

  // Max edge weight for scaling
  const maxWeight = d3.max(simLinks, d => d.weight) || 1;

  // Draw edges
  const link = g.append('g')
    .attr('class', 'links')
    .selectAll('line')
    .data(simLinks)
    .join('line')
    .attr('stroke', '#2d2d5e')
    .attr('stroke-opacity', 0.5)
    .attr('stroke-width', d => Math.max(0.5, Math.sqrt(d.weight / maxWeight) * 4));

  // Draw nodes
  const node = g.append('g')
    .attr('class', 'nodes')
    .selectAll('circle')
    .data(simNodes)
    .join('circle')
    .attr('r', d => getNodeRadius(d, sizeMode))
    .attr('fill', d => getNodeColor(d, colorMode))
    .attr('stroke', 'rgba(255,255,255,0.15)')
    .attr('stroke-width', 0.5)
    .attr('cursor', 'pointer')
    .call(d3.drag()
      .on('start', dragStart)
      .on('drag', dragging)
      .on('end', dragEnd));

  // Labels
  let labels = null;
  if (showLabels) {
    labels = g.append('g')
      .attr('class', 'labels')
      .selectAll('text')
      .data(simNodes)
      .join('text')
      .text(d => d.id)
      .attr('font-size', '7px')
      .attr('fill', 'var(--text-dim)')
      .attr('text-anchor', 'middle')
      .attr('dy', d => -getNodeRadius(d, sizeMode) - 3)
      .attr('pointer-events', 'none');
  }

  // Tooltip
  const tooltip = document.getElementById('tooltip');

  node.on('mouseover', function(event, d) {
    d3.select(this).attr('stroke', '#fff').attr('stroke-width', 2);
    const grade = d.quality_grade || 'N/A';
    const rob = d.classification || 'N/A';
    const risk = d.oracle_risk != null ? (d.oracle_risk * 100).toFixed(0) + '%' : 'N/A';
    tooltip.innerHTML =
      '<div class="tt-id">' + d.id + '</div>' +
      '<div class="tt-row">Studies: <span>' + d.k + '</span></div>' +
      '<div class="tt-row">MAs: <span>' + d.n_mas + '</span></div>' +
      '<div class="tt-row">Quality: <span>' + grade + '</span></div>' +
      '<div class="tt-row">Robustness: <span>' + rob + '</span></div>' +
      '<div class="tt-row">Oracle Risk: <span>' + risk + '</span></div>' +
      '<div class="tt-row">Audit Fails: <span>' + d.audit_fails + '</span></div>';
    tooltip.style.display = 'block';
  })
  .on('mousemove', function(event) {
    const canvasRect = canvas.getBoundingClientRect();
    tooltip.style.left = (event.clientX - canvasRect.left + 12) + 'px';
    tooltip.style.top = (event.clientY - canvasRect.top - 10) + 'px';
  })
  .on('mouseout', function() {
    d3.select(this).attr('stroke', 'rgba(255,255,255,0.15)').attr('stroke-width', 0.5);
    tooltip.style.display = 'none';
  })
  .on('click', function(event, d) {
    event.stopPropagation();
    selectNode(d.id, simNodes, simLinks, node, link, labels, colorMode, sizeMode);
  });

  // Click on background to deselect
  svg.on('click', () => {
    deselectAll(node, link, labels, colorMode, sizeMode);
  });

  // Tick
  simulation.on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);

    node
      .attr('cx', d => d.x)
      .attr('cy', d => d.y);

    if (labels) {
      labels
        .attr('x', d => d.x)
        .attr('y', d => d.y - getNodeRadius(d, sizeMode) - 3);
    }
  });

  // Update legend
  updateLegend(colorMode);

  // Store references for updates
  window._networkRefs = { node, link, labels, simNodes, simLinks, g, svg, zoom };

  // Drag functions
  function dragStart(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  }
  function dragging(event, d) {
    d.fx = event.x;
    d.fy = event.y;
  }
  function dragEnd(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
  }
}

function selectNode(nodeId, simNodes, simLinks, nodeSelection, linkSelection, labels, colorMode, sizeMode) {
  selectedNode = nodeId;

  // Find connected node IDs
  const connected = new Set();
  simLinks.forEach(l => {
    const src = typeof l.source === 'object' ? l.source.id : l.source;
    const tgt = typeof l.target === 'object' ? l.target.id : l.target;
    if (src === nodeId) connected.add(tgt);
    if (tgt === nodeId) connected.add(src);
  });

  // Dim non-connected nodes
  nodeSelection
    .attr('opacity', d => (d.id === nodeId || connected.has(d.id)) ? 1 : 0.1)
    .attr('stroke', d => d.id === nodeId ? '#fff' : 'rgba(255,255,255,0.15)')
    .attr('stroke-width', d => d.id === nodeId ? 3 : 0.5);

  linkSelection
    .attr('stroke-opacity', l => {
      const src = typeof l.source === 'object' ? l.source.id : l.source;
      const tgt = typeof l.target === 'object' ? l.target.id : l.target;
      return (src === nodeId || tgt === nodeId) ? 0.8 : 0.03;
    })
    .attr('stroke', l => {
      const src = typeof l.source === 'object' ? l.source.id : l.source;
      const tgt = typeof l.target === 'object' ? l.target.id : l.target;
      return (src === nodeId || tgt === nodeId) ? '#6366f1' : '#2d2d5e';
    });

  if (labels) {
    labels.attr('opacity', d => (d.id === nodeId || connected.has(d.id)) ? 1 : 0.1);
  }

  // Update detail panel
  showDetailPanel(nodeId, connected);

  // Update review tab
  updateReviewTab(nodeId, connected);
}

function deselectAll(nodeSelection, linkSelection, labels, colorMode, sizeMode) {
  selectedNode = null;
  nodeSelection
    .attr('opacity', 1)
    .attr('stroke', 'rgba(255,255,255,0.15)')
    .attr('stroke-width', 0.5);
  linkSelection
    .attr('stroke-opacity', 0.5)
    .attr('stroke', '#2d2d5e');
  if (labels) labels.attr('opacity', 1);

  document.getElementById('detail-empty').style.display = 'block';
  document.getElementById('detail-content').style.display = 'none';
}

function initSearch() {
  const input = document.getElementById('search-input');
  input.addEventListener('input', () => {
    const q = input.value.trim().toUpperCase();
    if (!q || !window._networkRefs) return;

    const refs = window._networkRefs;
    const match = refs.simNodes.find(n => n.id.includes(q));
    if (match) {
      const cm = document.getElementById('color-mode').value;
      const sm = document.getElementById('size-mode').value;
      selectNode(match.id, refs.simNodes, refs.simLinks, refs.node, refs.link, refs.labels, cm, sm);

      // Center on match
      const canvas = document.getElementById('network-canvas');
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      refs.svg.transition().duration(500).call(
        refs.zoom.transform,
        d3.zoomIdentity.translate(w / 2, h / 2).scale(2).translate(-match.x, -match.y)
      );
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') e.preventDefault();
  });
}

let clustersBuilt = false;

function buildClusters() {
  clustersBuilt = true;

  const multiNode = components.filter(c => c.length > 1);
  const isolated = components.filter(c => c.length === 1);

  document.getElementById('cluster-summary').textContent =
    multiNode.length + ' connected components with 2+ reviews, ' +
    isolated.length + ' isolated reviews. Largest component: ' +
    (components[0] ? components[0].length : 0) + ' reviews.';

  // Cluster size distribution chart
  const chartDiv = document.getElementById('cluster-chart-container');
  const sizes = multiNode.map(c => c.length);
  const sizeCounts = {};
  sizes.forEach(s => { sizeCounts[s] = (sizeCounts[s] || 0) + 1; });
  const sizeLabels = Object.keys(sizeCounts).sort((a, b) => +a - +b);
  const sizeValues = sizeLabels.map(s => sizeCounts[s]);

  Plotly.newPlot(chartDiv, [{
    x: sizeLabels,
    y: sizeValues,
    type: 'bar',
    marker: { color: '#6366f1' }
  }], {
    title: { text: 'Component Size Distribution', font: { color: '#e2e8f0', size: 14 } },
    paper_bgcolor: '#12122a',
    plot_bgcolor: '#12122a',
    xaxis: { title: 'Component Size', color: '#94a3b8', gridcolor: '#2d2d5e' },
    yaxis: { title: 'Count', color: '#94a3b8', gridcolor: '#2d2d5e' },
    font: { color: '#e2e8f0' },
    margin: { t: 40, b: 50, l: 50, r: 20 },
    height: 280
  }, { responsive: true });

  // Build cluster cards (top 20 multi-node clusters)
  const grid = document.getElementById('cluster-grid');
  grid.innerHTML = '';

  multiNode.slice(0, 20).forEach((comp, idx) => {
    // Compute cluster stats
    let totalK = 0, totalQuality = 0, qualityCount = 0;
    let totalRobustness = 0, robustnessCount = 0;
    let totalEdges = 0;

    comp.forEach(rid => {
      const n = nodeMap[rid];
      if (n) {
        totalK += n.k || 0;
        if (n.quality_score != null) { totalQuality += n.quality_score; qualityCount++; }
        if (n.robustness_score != null) { totalRobustness += n.robustness_score; robustnessCount++; }
      }
    });

    const compSet = new Set(comp);
    NETWORK_DATA.edges.forEach(e => {
      const src = typeof e.source === 'object' ? e.source.id : e.source;
      const tgt = typeof e.target === 'object' ? e.target.id : e.target;
      if (compSet.has(src) && compSet.has(tgt)) totalEdges++;
    });

    const meanQ = qualityCount > 0 ? (totalQuality / qualityCount).toFixed(1) : 'N/A';
    const meanR = robustnessCount > 0 ? (totalRobustness / robustnessCount).toFixed(1) : 'N/A';

    const card = document.createElement('div');
    card.className = 'cluster-card';
    card.innerHTML =
      '<h3>Component ' + (idx + 1) + ' (' + comp.length + ' reviews)</h3>' +
      '<div class="detail-row"><span class="label">Internal edges</span><span class="value">' + totalEdges + '</span></div>' +
      '<div class="detail-row"><span class="label">Total studies</span><span class="value">' + totalK + '</span></div>' +
      '<div class="detail-row"><span class="label">Mean quality</span><span class="value">' + meanQ + '</span></div>' +
      '<div class="detail-row"><span class="label">Mean robustness</span><span class="value">' + meanR + '</span></div>' +
      '<div class="cluster-members">' +
        comp.map(rid => '<span class="cluster-tag" data-review="' + rid + '">' + rid + '</span>').join('') +
      '</div>';
    grid.appendChild(card);

    // Click on tags to navigate
    card.querySelectorAll('.cluster-tag').forEach(tag => {
      tag.addEventListener('click', () => {
        navigateToReview(tag.dataset.review);
      });
    });
  });
}

function navigateToReview(reviewId) {
  // Switch to network tab and select node
  document.querySelector('[data-tab="tab-network"]').click();
  setTimeout(() => {
    if (window._networkRefs) {
      const refs = window._networkRefs;
      const cm = document.getElementById('color-mode').value;
      const sm = document.getElementById('size-mode').value;
      selectNode(reviewId, refs.simNodes, refs.simLinks, refs.node, refs.link, refs.labels, cm, sm);

      // Center on node
      const simNode = refs.simNodes.find(n => n.id === reviewId);
      if (simNode) {
        const canvas = document.getElementById('network-canvas');
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        refs.svg.transition().duration(500).call(
          refs.zoom.transform,
          d3.zoomIdentity.translate(w / 2, h / 2).scale(2).translate(-simNode.x, -simNode.y)
        );
      }
    }
  }, 100);
}

    '<div class="chart-card"><h3>Degree Distribution</h3><div id="chart-degree"></div></div>';

  const plotLayout = {
    paper_bgcolor: '#12122a',
    plot_bgcolor: '#12122a',
    font: { color: '#e2e8f0' },
    margin: { t: 10, b: 40, l: 50, r: 20 },
    height: 260,
    xaxis: { color: '#94a3b8', gridcolor: '#2d2d5e' },
    yaxis: { color: '#94a3b8', gridcolor: '#2d2d5e', title: 'Count' },
  };

  // Quality grade
  const qd = s.quality_distribution || {};
  Plotly.newPlot('chart-quality', [{
    x: Object.keys(qd),
    y: Object.values(qd),
    type: 'bar',
    marker: { color: Object.keys(qd).map(k => gradeColors[k] || '#666') }
  }], { ...plotLayout }, { responsive: true });

  // Robustness
  const rd = s.robustness_distribution || {};
  Plotly.newPlot('chart-robustness', [{
    x: Object.keys(rd),
    y: Object.values(rd),
    type: 'bar',
    marker: { color: Object.keys(rd).map(k => robustnessColors[k] || '#666') }
  }], { ...plotLayout }, { responsive: true });

  // Oracle risk histogram
  const oracleVals = NETWORK_DATA.nodes.filter(n => n.oracle_risk != null).map(n => n.oracle_risk);
  Plotly.newPlot('chart-oracle', [{
    x: oracleVals,
    type: 'histogram',
    nbinsx: 20,
    marker: { color: '#6366f1' }
  }], { ...plotLayout, xaxis: { ...plotLayout.xaxis, title: 'Oracle Risk Probability' } }, { responsive: true });

  // Degree distribution
  const degrees = {};
  NETWORK_DATA.edges.forEach(e => {
    const src = typeof e.source === 'object' ? e.source.id : e.source;
    const tgt = typeof e.target === 'object' ? e.target.id : e.target;
    degrees[src] = (degrees[src] || 0) + 1;
    degrees[tgt] = (degrees[tgt] || 0) + 1;
  });
  const degreeVals = Object.values(degrees);
  Plotly.newPlot('chart-degree', [{
    x: degreeVals,
    type: 'histogram',
    nbinsx: 20,
    marker: { color: '#14b8a6' }
  }], { ...plotLayout, xaxis: { ...plotLayout.xaxis, title: 'Node Degree' } }, { responsive: true });
}
